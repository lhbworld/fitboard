spring:
  application:
    name: fitboard

  datasource:
    url: jdbc:mysql://localhost:3306/fitboard?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: fituser
    password: fit1234!
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

jwt:
  secret: fitboard-jwt-secret-key-2026-for-access-token-dev
  expiration-ms: 3600000

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: "http://localhost:8081/api/auth/kakao/callback"
  frontend-redirect-uri: "http://localhost:5173/oauth/kakao/callback"